name: CI

# Roda em todo PR e na main. A proteção da main exige os dois jobs verdes antes do merge.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # O build roda type-check e lint. A URL só precisa existir: nada é chamado aqui.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.exemplo.invalid/api/v1
